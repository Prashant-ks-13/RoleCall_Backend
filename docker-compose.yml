name: rolecall

networks:
  rolecall-net:
    driver: bridge

volumes:
  mysql-data:
  kafka-data:

services:
  mysql:
    image: mysql:8.4
    container_name: rolecall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: rolecall
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pw}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user_pw}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:-job_pw}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD:-application_pw}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pw}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rolecall-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.8.0
    container_name: rolecall-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: rolecall-kafka-cluster-1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - rolecall-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: rolecall-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - rolecall-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: rolecall-config-server
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8888:8888"
    networks:
      - rolecall-net
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: rolecall-api-gateway
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_SERVICE_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8080:8080"
    networks:
      - rolecall-net
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: rolecall-auth-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_KEYSTORE_PATH: ${JWT_KEYSTORE_PATH:-}
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:-}
      JWT_KEY_ALIAS: ${JWT_KEY_ALIAS:-rolecall-auth}
      JWT_KEY_PASSWORD: ${JWT_KEY_PASSWORD:-}
    ports:
      - "8081:8081"
    networks:
      - rolecall-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: rolecall-user-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: user_service
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUTH_SERVICE_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8082:8082"
    networks:
      - rolecall-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  job-service:
    build:
      context: .
      dockerfile: job-service/Dockerfile
    container_name: rolecall-job-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: job_service
      DB_PASSWORD: ${JOB_DB_PASSWORD:-job_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUTH_SERVICE_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8083:8083"
    networks:
      - rolecall-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    container_name: rolecall-application-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: application_service
      DB_PASSWORD: ${APPLICATION_DB_PASSWORD:-application_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUTH_SERVICE_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8084:8084"
    networks:
      - rolecall-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: rolecall-payment-service
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: payment_service
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUTH_SERVICE_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_CALLBACK_URL: ${RAZORPAY_CALLBACK_URL:-http://localhost:5173/payments/callback}
    ports:
      - "8085:8085"
    networks:
      - rolecall-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
